<!doctype html>
<html><head><meta charset="utf-8"><title>Halloween Ghost</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:14px;bottom:12px;font:18px -apple-system,sans-serif;color:#8a8a8a;white-space:pre;cursor:default}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script>
// Friendly window ghost v2 for rear projection.
// greet (someone arrives) -> ghost pops up, waves, "Wave at me!"; wave back -> random kid-friendly reaction.
// Live: SSE /events {type:'greet'|'wave'|'react'|'mirror'}. Render: ?render, window.EVENTS preset, draw(t) is pure.
// Keys: G greet · W random reaction · 1-9,0 specific reaction · M mirror · S sound · T text bubbles
//       arrows move · +/- size · R reset position · H status · F fullscreen
const P = new URLSearchParams(location.search), RENDER = P.has('render');
let store = {}; try { if (!RENDER) store = JSON.parse(localStorage.getItem('ghost2') || '{}'); } catch {}
const pick = (k, d) => P.has(k) ? P.get(k) : (store[k] ?? d);
const bool = v => !(v === false || v === '0' || v === 'false');
const CFG = { mirror: bool(pick('mirror', true)), sound: bool(pick('sound', true)), text: bool(pick('text', true)),
  gx: +pick('gx', .5), gy: +pick('gy', .5), gs: +pick('gs', 1) };
const save = () => { if (!RENDER) localStorage.setItem('ghost2', JSON.stringify(CFG)); };

const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 1920, H = 1080;
function resize() { if (RENDER) { cv.width = W; cv.height = H; return; } W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b) => ease(ramp(t, a, b));
const backOut = u => { u = clamp(u); const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const within = (u, a, b, f = .2) => E(u, a, a + f) * (1 - E(u, b - f, b));
function rng(sd) { return () => { sd = sd + 0x6D2B79F5 | 0; let t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); return (n ^ n >>> 16) >>> 0; };
const FONT = '"Chalkboard SE","Marker Felt","Comic Sans MS",sans-serif';

// ---------- events ----------
const KINDS = ['twirl', 'boo', 'sneeze', 'hat', 'triplets', 'bat', 'hiccup', 'candy', 'loop', 'golden'];
const DUR = { greet: 4.3, twirl: 3.4, boo: 3.7, sneeze: 3.8, hat: 4.4, triplets: 4.5, bat: 5.0, hiccup: 3.6, candy: 5.0, loop: 3.6, golden: 5.5 };
window.EVENTS = window.EVENTS || [];
function activeEvent(t) {
  for (let i = EVENTS.length - 1; i >= 0; i--) { const e = EVENTS[i]; if (t >= e.t) return t - e.t < DUR[e.kind] ? e : null; }
  return null;
}
// sound plan: [clip, seconds after event start]
const SFX = { greet: e => [[e.say || 'hi', .75]], twirl: () => [['wheee', .25]], boo: () => [['boo', 1.4]], sneeze: () => [['sneeze', .26]],
  hat: () => [['tada', 1.05]], triplets: () => [['triplets', 1.15]], bat: () => [['bat', 1.0]], hiccup: () => [['hic', .3]],
  candy: () => [['candy', .45]], loop: () => [['wheee', .3], ['wheee', 1.85]], golden: () => [['golden', .6]] };
window.SFX_PLAN = e => SFX[e.kind](e);

// ---------- geometry ----------
function geom() { const s = Math.min(W / 1920, H / 1080) * .9 * CFG.gs; return { s, cx: W * CFG.gx, cy: H * CFG.gy + 70 * s }; }

// ---------- pose ----------
function basePose(t) {
  return { dx: Math.sin(t * .45) * 40, dy: Math.sin(t * 1.25) * 20, rot: Math.sin(t * .8) * .035, sc: 1, sx: 1, sy: 1, alpha: 1,
    armL: .55 + Math.sin(t * 1.3) * .06, armR: .55 + Math.sin(t * 1.3 + 1) * .06, waveL: 0, waveR: 0, armsFront: false,
    eyes: 'open', look: Math.sin(t * .37) * 8, lookY: 0, eyeS: 1, mouth: 'o', mouthK: 0, cheeks: 0, excite: 0,
    glow: [160, 205, 255], tint: null, tintK: 0, gold: 0, sway: Math.sin(t * 1.1 + .6) * 22, blink: ((t + 1.7) % 4.6) < .13, hat: null };
}
const kE = (u, D) => E(u, 0, .3) * (1 - E(u, D - .5, D));
function happy(p, k) { if (k <= 0) return; p.mouth = 'smile'; p.mouthK = k; p.cheeks = k; p.eyeS = 1 + .15 * k; p.excite = k; }
function raise(p, side, amt, wave = 1, to = 2.55) { if (side >= 0) { p.armR = lerp(p.armR, to, amt); p.waveR = amt * wave; } if (side <= 0) { p.armL = lerp(p.armL, to, amt); p.waveL = amt * wave; } }

// ---------- reactions ----------
const ACT = {
  greet(u, p, e, c) {
    const D = DUR.greet, k = kE(u, D), side = e.side || 1;
    p.dy += u < .35 ? 300 * ease(u / .35) : 300 * (1 - backOut((u - .35) / .6));
    p.alpha = u < .35 ? 1 - .6 * ease(u / .35) : .4 + .6 * E(u, .35, .7);
    happy(p, k); p.look += side * 14 * k; p.rot += side * .06 * k; p.eyeS += .1 * k;
    raise(p, side, E(u, .8, 1.1) * (1 - E(u, 3.5, 4.0)));
    c.bubbles.push({ text: e.say === 'hi2' ? 'Ooh, visitors!\nWave hello! 👋' : 'Hiii!\nWave at me! 👋', a: within(u, .7, 4.0), pu: u - .7 });
    c.fx.push(({ hx, hy, s }) => burst(hx, hy + 200 * s, u - .9, e.seed, 18, s, { v: 500 }));
  },
  twirl(u, p, e, c) {
    const k = kE(u, DUR.twirl), r = E(u, .3, 2.3); happy(p, k); p.eyes = 'happy';
    p.sx = Math.cos(r * Math.PI * 4); p.dy -= 80 * Math.sin(r * Math.PI); raise(p, 0, k * .8, 0, 1.7);
    c.bubbles.push({ text: 'Wheee! ✨', a: within(u, .2, 2.8), pu: u - .2 });
    c.fx.push(({ gx, gy, s }) => { orbit(gx, gy - 60 * s, s, u, r, e); burst(gx, gy - 80 * s, u - 2.3, e.seed, 36 * mult(e), s, { v: 750 }); });
  },
  boo(u, p, e, c) {
    const cover = E(u, 0, .35) * (1 - E(u, 1.35, 1.45));
    p.armsFront = cover > .05; p.armL = lerp(p.armL, 3.7, cover); p.armR = lerp(p.armR, 3.7, cover);
    p.sc *= 1 - .08 * cover; if (u > .5 && u < 1.4) p.dx += Math.sin(u * 40) * 4; p.eyes = cover > .5 ? 'closed' : 'open';
    const pop = E(u, 1.4, 1.58) * (1 - E(u, 3.0, 3.6));
    if (u >= 1.38) { p.sc *= 1 + .28 * pop; p.armL = lerp(p.armL, 2.3, pop); p.armR = lerp(p.armR, 2.3, pop); p.mouth = 'open'; p.mouthK = pop; p.eyeS = 1 + .4 * pop; p.cheeks = pop; p.excite = pop; p.eyes = 'open'; if (u > 2.4) happy(p, pop); }
    c.bubbles.push({ text: 'BOO! 👻\nHee hee!', a: within(u, 1.4, 3.3, .1), pu: u - 1.4, big: 1.25 });
    c.fx.push(({ gx, gy, s }) => burst(gx, gy - 100 * s, u - 1.4, e.seed, 40 * mult(e), s, { v: 900 }));
  },
  sneeze(u, p, e, c) {
    const build = E(u, .6, 1.85) * (1 - E(u, 1.86, 1.92));
    p.rot -= .16 * build; p.dy -= 25 * build; p.mouth = 'open'; p.mouthK = .25 + .45 * build;
    p.eyes = u > .8 && u < 1.9 ? 'squint' : 'open';
    if (u >= 1.9) { const v = u - 1.9, l = Math.exp(-v * 4); p.rot += .25 * l * Math.cos(v * 7); p.dy += 55 * l; p.sc *= 1 + .06 * l;
      p.eyes = v < .35 ? 'closed' : 'open'; if (v < .4) { p.mouth = 'open'; p.mouthK = .9; } else happy(p, 1 - E(u, 3.3, 3.8)); }
    const bs = [['Ah…', .9, 1.55], ['Ah… ah…', 1.55, 1.9], ['ACHOO!!', 1.9, 2.5], ['Oops!\nExcuse me! 🤭', 2.5, 3.7]];
    for (const [tx, a0, a1] of bs) c.bubbles.push({ text: tx, a: within(u, a0, a1, .06), pu: u - a0, big: tx === 'ACHOO!!' ? 1.35 : 1 });
    c.fx.push(({ mx, my, s }) => confetti(mx, my, u - 1.9, e.seed, s, mult(e)));
  },
  hat(u, p, e, c) {
    const kind = ['witch', 'party', 'pumpkin'][e.seed % 3], k = kE(u, DUR.hat), fall = E(u, .25, 1.05);
    let dy = -750 * (1 - fall); if (u > 1.05) dy -= 45 * Math.exp(-(u - 1.05) * 6) * Math.abs(Math.sin((u - 1.05) * 14));
    p.hat = { kind, dy, a: 1 - E(u, 3.8, 4.35), rot: .25 * (1 - fall) };
    if (u > 1.05) p.sy = 1 - .08 * Math.exp(-(u - 1.05) * 8);
    p.lookY = -10 * (1 - E(u, .9, 1.2)) * E(u, .1, .3); happy(p, E(u, 1.05, 1.3) * k); raise(p, e.side || 1, E(u, 1.1, 1.4) * k, .35, 2.2);
    c.bubbles.push({ text: 'Ta-da! ✨\nDo you like my hat?', a: within(u, 1.1, 3.9), pu: u - 1.1 });
    c.fx.push(({ hx, hy, s }) => burst(hx, hy, u - 1.05, e.seed, 30 * mult(e), s, { v: 650 }));
  },
  triplets(u, p, e, c) {
    const split = E(u, .6, 1.1) * (1 - E(u, 3.3, 3.9)), t = c.t;
    if (u < .6) p.sx = 1 + .08 * Math.sin(u * 30) * E(u, 0, .3);
    p.alpha *= 1 - split; if (split > .98) c.hideMain = true;
    if (split > .02) c.minis = [-1, 0, 1].map(i => { const q = basePose(t + i * 1.3 + 3); q.sc = lerp(1, .55, split); q.alpha = split; q.dx = p.dx + i * 340 * split; q.dy = p.dy + 110 * split + Math.sin(t * 3 + i) * 15;
      happy(q, split); raise(q, i === 0 ? 1 : -i, split, 1); q.eyes = 'open'; return q; });
    c.bubbles.push({ text: 'Now there are\nthree of us!', a: within(u, 1.15, 3.2), pu: u - 1.15, at: { x: 0, y: -150 } });
    c.fx.push(({ gx, gy, s }) => { burst(gx, gy, u - 1.0, e.seed, 30, s, { v: 800 }); burst(gx, gy, u - 3.85, e.seed + 1, 30 * mult(e), s, { v: 800 }); });
  },
  bat(u, p, e, c) {
    const side = e.side || 1, k = kE(u, DUR.bat), t = c.t; let bx, by;
    if (u < 1.2) { const a = E(u, .1, 1.2); bx = lerp(1350, 400, a); by = lerp(-550, -170, a) - 140 * Math.sin(a * Math.PI); }
    else if (u < 3.7) { bx = 400 + Math.sin(t * 2) * 25; by = -170 + Math.sin(t * 3.1) * 28; }
    else { const a = E(u, 3.7, 4.9); bx = lerp(400, -1500, a); by = lerp(-170, -950, a) - 220 * Math.sin(a * Math.PI); }
    bx *= side; happy(p, k); p.look += side * 18 * k; p.rot += side * .05 * k; raise(p, side, E(u, 1.0, 1.3) * (1 - E(u, 3.7, 4.1)));
    c.bubbles.push({ text: 'This is my friend\nBatty! 🦇', a: within(u, 1.0, 3.6), pu: u - 1.0 });
    c.fx.push(({ cx, cy, s }) => drawBat(cx + bx * s, cy + by * s, s * 1.15, t, side));
  },
  hiccup(u, p, e, c) {
    const hics = [.3, .74, 1.62], cols = [[255, 140, 205], [130, 255, 170], [255, 215, 100]];
    let n = 0; for (const h of hics) { const v = u - h; if (v >= 0) n++; if (v > 0 && v < .45) { p.dy -= 115 * Math.sin(v / .45 * Math.PI); p.eyeS = 1.35; p.mouth = 'o'; p.mouthK = .8; } }
    if (n) { const k = .6 * (1 - E(u, 2.9, 3.5)); p.tint = cols[(n - 1) % 3]; p.tintK = k; p.glow = cols[(n - 1) % 3].map((v, i) => lerp(p.glow[i], v, k / .6)); }
    if (u > 2.4) happy(p, kE(u, DUR.hiccup));
    for (const [tx, a0, a1] of [['Hic!', .3, .7], ['Hic!', .74, 1.0], ['Oh no…', 1.0, 1.6], ['HIC!', 1.62, 2.4]]) c.bubbles.push({ text: tx, a: within(u, a0, a1, .05), pu: u - a0 });
  },
  candy(u, p, e, c) {
    const a = E(u, .2, .6) * (1 - E(u, 4.2, 4.8)); happy(p, a); p.eyes = u > .6 && u < 4 ? 'happy' : 'open';
    raise(p, 1, a, .5, 2.5); raise(p, -1, a, .5, 2.5);
    c.bubbles.push({ text: 'Happy\nHalloween! 🎃', a: within(u, .45, 3.9), pu: u - .45 });
    c.fx.push(({ s }) => candyRain(u, e.seed, s, mult(e)));
  },
  loop(u, p, e, c) {
    const { s } = geom(), edge = W / 2 / s + 520, k = kE(u, DUR.loop);
    if (u < .25) p.sc *= 1 - .08 * ease(u / .25);
    else if (u < 1.15) { const a = (u - .25) / .9; p.dx += edge * a * a; p.sx = 1 + .35 * a; p.rot += .3 * a; }
    else if (u < 1.5) { p.alpha = 0; c.hideMain = true; }
    else { const a = clamp((u - 1.5) / 1.1); p.dx -= edge * (1 - backOut(a)); p.rot -= .25 * (1 - ease(a)); }
    happy(p, k); raise(p, 0, within(u, .25, 2.9), .3, 2.4);
    c.bubbles.push({ text: 'Wheee!', a: within(u, .2, 1.0, .1), pu: u - .2 });
    c.bubbles.push({ text: "I'm back! 😄", a: within(u, 2.1, 3.3), pu: u - 2.1 });
  },
  golden(u, p, e, c) {
    const gk = E(u, .1, .7) * (1 - E(u, 4.6, 5.4)); p.gold = gk; p.glow = [lerp(p.glow[0], 255, gk), lerp(p.glow[1], 200, gk), lerp(p.glow[2], 70, gk)];
    happy(p, gk); p.sc *= 1 + .1 * gk; raise(p, 0, gk, .5, 2.5);
    p.hat = { kind: 'crown', dy: -320 * (1 - E(u, .5, 1.1)), a: gk, rot: 0 };
    c.bubbles.push({ text: 'WOW! You found the\nGOLDEN GHOST! ⭐', a: within(u, .7, 4.5), pu: u - .7 });
    c.back.push(({ gx, gy, s }) => rays(gx, gy - 60 * s, s, c.t, gk));
    c.fx.push(({ gx, gy, s }) => { orbit(gx, gy - 60 * s, s, u, gk, e, [255, 215, 90]); burst(gx, gy - 100 * s, u - .6, e.seed, 50, s, { v: 900, colors: ['255,220,90', '255,250,200'] }); });
  },
};
const mult = e => 1 + .5 * Math.min(3, (e.combo || 1) - 1);

// idle fidgets (no one around): deterministic schedule
const FID = {
  yawn(u, p) { const a = E(u, .2, .8) * (1 - E(u, 2.2, 2.9)); p.armL = lerp(p.armL, 2.6, a); p.armR = lerp(p.armR, 2.6, a); p.mouth = 'open'; p.mouthK = .9 * a; if (a > .4) p.eyes = 'closed'; p.dy -= 20 * a; p.sy = 1 + .05 * a; },
  peek(u, p) { const a = E(u, 0, .6) * (1 - E(u, 1.8, 2.6)); p.dy += 230 * a; p.dx += 120 * a; p.rot += .25 * a; p.eyeS = 1 + .3 * a; p.lookY = -12 * a; },
  look(u, p) { p.look += -26 * within(u, .2, 1.3) + 26 * within(u, 1.5, 2.6); p.eyeS = 1.15; },
  wiggle(u, p) { const a = Math.sin(clamp(u / 2.8) * Math.PI); p.rot += .12 * Math.sin(u * 12) * a; happy(p, a * .8); p.eyes = a > .3 ? 'happy' : 'open'; },
};
function fidgetAt(t) {
  const PER = 22, slot = Math.floor((t - 8) / PER); if (slot < 0) return null;
  const t0 = 8 + slot * PER + hash(slot) % 5, u = t - t0; if (u < 0 || u > 3.1) return null;
  for (const e of EVENTS) if (e.t <= t && t - e.t < DUR[e.kind] + 6) return null;
  return { kind: ['yawn', 'peek', 'look', 'wiggle'][hash(slot * 7 + 3) % 4], u };
}

// ---------- drawing ----------
const mixc = (a, b, k) => a.map((v, i) => Math.round(lerp(v, b[i], k)));
function sleeve(sx, ang, s) {
  const sig = Math.sign(sx) || 1;
  g.save(); g.translate(sx, -40 * s); g.rotate(-sig * ang);
  const L = 175 * s, w0 = 52 * s, w1 = 34 * s;
  g.beginPath(); g.moveTo(-w0, 0);
  g.bezierCurveTo(-w0 * 1.05, L * .45, -w1 * 1.3, L * .8, 0, L + w1 * .2);
  g.bezierCurveTo(w1 * 1.3, L * .8, w0 * 1.05, L * .45, w0, 0);
  g.closePath(); g.fill(); g.restore();
}
function ghostAt(p, cx, cy, s, t) {
  if (p.alpha <= .01) return;
  g.save(); g.globalAlpha *= p.alpha;
  g.translate(cx + p.dx * s, cy + p.dy * s); g.rotate(p.rot); g.scale(p.sx * p.sc, p.sy * p.sc);
  let c0 = [255, 255, 255], c1 = [236, 244, 255], c2 = [190, 212, 240];
  if (p.tint && p.tintK) { c0 = mixc(c0, p.tint, p.tintK * .35); c1 = mixc(c1, p.tint, p.tintK * .55); c2 = mixc(c2, p.tint, p.tintK * .8); }
  if (p.gold) { c0 = mixc(c0, [255, 247, 205], p.gold); c1 = mixc(c1, [255, 222, 110], p.gold); c2 = mixc(c2, [240, 170, 40], p.gold); }
  const body = g.createRadialGradient(0, -170 * s, 20 * s, 0, 40 * s, 470 * s);
  body.addColorStop(0, `rgba(${c0},.98)`); body.addColorStop(.55, `rgba(${c1},.95)`); body.addColorStop(1, `rgba(${c2},.82)`);
  g.fillStyle = body; g.shadowColor = `rgba(${p.glow.map(Math.round)},.9)`; g.shadowBlur = (55 + 30 * p.excite + 8 * Math.sin(t * 2)) * s;
  const arms = () => {
    const oR = p.waveR ? Math.sin(t * Math.PI * 2 * 1.9) * .38 * p.waveR : 0, oL = p.waveL ? Math.sin(t * Math.PI * 2 * 1.9 + 1) * .38 * p.waveL : 0;
    sleeve(140 * s, p.armR + oR, s); sleeve(-140 * s, p.armL + oL, s);
  };
  if (!p.armsFront) arms();
  const D = (x, y) => { const f = clamp((y + 160 * s) / (460 * s)); return [x + p.sway * s * f * f, y]; };
  const hemY = 300 * s, N = 6, HW = 215 * s;
  g.beginPath(); g.moveTo(...D(-150 * s, -170 * s)); g.arc(0, -170 * s, 150 * s, Math.PI, 0);
  g.bezierCurveTo(...D(150 * s, -40 * s), ...D(190 * s, 130 * s), ...D(HW, hemY));
  for (let i = 0; i < N; i++) {
    const x1 = HW - 2 * HW * (i + 1) / N, xm = HW - 2 * HW * (i + .5) / N;
    g.quadraticCurveTo(...D(xm, hemY + 46 * s + Math.sin(t * 2.6 + i * 1.3) * 14 * s), ...D(x1, hemY + (i + 1 < N ? Math.sin(t * 2.6 + (i + 1) * 1.3) * 10 * s : 0)));
  }
  g.bezierCurveTo(...D(-190 * s, 130 * s), ...D(-150 * s, -40 * s), ...D(-150 * s, -170 * s));
  g.closePath(); g.fill(); g.shadowBlur = 0;
  face(p, s);
  if (p.armsFront) { g.fillStyle = body; g.shadowColor = `rgba(${p.glow.map(Math.round)},.6)`; g.shadowBlur = 20 * s; arms(); g.shadowBlur = 0; }
  if (p.hat && p.hat.a > 0) drawHat(p.hat, s, t);
  g.restore();
}
function face(p, s) {
  const lx = p.look * s, ly = p.lookY * s, ink = '#0b0b12';
  g.fillStyle = ink; g.strokeStyle = ink; g.lineCap = 'round';
  const eyes = p.blink && p.eyes === 'open' ? 'closed' : p.eyes;
  for (const ex of [-52, 52]) {
    const x = ex * s + lx, y = -185 * s + ly, es = p.eyeS;
    if (eyes === 'open') { g.beginPath(); g.ellipse(x, y, 23 * s * es, 36 * s * es, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(x + 8 * s, y - 12 * s, 7 * s * es, 0, 7); g.fill(); g.fillStyle = ink; }
    else if (eyes === 'happy') { g.lineWidth = 11 * s; g.beginPath(); g.arc(x, y + 10 * s, 22 * s, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    else if (eyes === 'squint') { g.lineWidth = 10 * s; g.beginPath(); g.moveTo(x - 22 * s, y - 8 * s * Math.sign(ex)); g.lineTo(x + 22 * s, y + 8 * s * Math.sign(ex)); g.stroke(); }
    else { g.lineWidth = 9 * s; g.beginPath(); g.arc(x, y - 4 * s, 20 * s, Math.PI * .15, Math.PI * .85); g.stroke(); }
  }

function drawHat(h, s, t) {
  g.save(); g.globalAlpha *= h.a; g.translate(0, (-305 + h.dy) * s); g.rotate(h.rot - .12);

    g.fillStyle = '#7dff9a'; g.fillRect(-88 * s, -42 * s, 176 * s, 30 * s); g.fillStyle = '#ffe066'; g.fillRect(-18 * s, -46 * s, 36 * s, 38 * s);

    g.fillStyle = '#ffe066'; for (let i = -4; i < 6; i++) { g.beginPath(); g.moveTo(-120 * s, (i * 60) * s - 30 * s); g.lineTo(120 * s, (i * 60 - 70) * s - 30 * s); g.lineTo(120 * s, (i * 60 - 45) * s - 30 * s); g.lineTo(-120 * s, (i * 60 + 25) * s - 30 * s); g.fill(); }

function star(x, y, r, rot) { g.beginPath(); for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, rr = i % 2 ? r * .35 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }

function drawBat(x, y, s, t, side) {
  const f = Math.sin(t * 14);

function bubble(b, x, y, s) {

  const w = Math.max(...lines.map(l => g.measureText(l).width)) + fs * 1.2, h = lines.length * fs * 1.18 + fs * .6;

const R0 = rng(7);
const sparks = Array.from({ length: 26 }, () => ({ x: R0() * 2 - 1, ph: R0(), sp: .05 + R0() * .08, r: 1.5 + R0() * 2.5, tw: R0() * 6 }));
const wisps = Array.from({ length: 7 }, () => ({ x: R0() * 2 - 1, ph: R0() * 6.28, r: .25 + R0() * .25 }));

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (CFG.mirror) { g.translate(W, 0); g.scale(-1, 1); }
  const { s, cx, cy } = geom();
  const p = basePose(t), c = { fx: [], back: [], bubbles: [], minis: null, hideMain: false, t };
  const ev = activeEvent(t);
  if (ev) ACT[ev.kind](t - ev.t, p, ev, c); else { const f = fidgetAt(t); if (f) FID[f.kind](f.u, p); }

window.draw = draw;

// ---------- live ----------
if (!RENDER) {

  const hud = document.getElementById('hud'); let showHud = P.has('hud'), conn = 'offline', lastMsg = '';

  }

    return bag.pop();

      lastGreet = t; const ev = { t, kind: 'greet', side: o.side || (Math.random() < .5 ? -1 : 1), seed, say: Math.random() < .5 ? 'hi' : 'hi2' };
      EVENTS.push(ev); playFor(ev); lastMsg = 'greet'; return true;
