<!doctype html>
<html><head><meta charset="utf-8"><title>Wave-back Ghost</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:12px;bottom:10px;font:14px -apple-system,sans-serif;color:#555;cursor:default}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script>
// Friendly sheet ghost for window projection. Black background = no light on the window.
// Live: listens to /events (SSE) for {"type":"wave","side":-1|1}. Keys: W wave, L/R wave left/right, M mirror, F fullscreen, H hud.
// Render: ?render -> draw(t) uses window.WAVES (deterministic).
const P = new URLSearchParams(location.search);
const RENDER = P.has('render');
let MIRROR = P.has('mirror');            // rear projection: flip so it reads right from outside
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 1920, H = 1080;
function resize() { if (RENDER) { cv.width = W; cv.height = H; return; } W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => (u = clamp(u), u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b) => ease(ramp(t, a, b));

// ---- wave reaction timing (seconds after trigger) ----
const NOTICE = .35, RAISE = .8, WAVE_END = 3.8, LOWER = 4.5;
window.WAVES = window.WAVES || [];
function waveState(t) {
  let ev = null; for (const w of window.WAVES) if (t >= w.t && t - w.t < LOWER + .6) ev = w;
  if (!ev) return { k: 0, arm: 0, osc: 0, side: 1, happy: 0 };
  const u = t - ev.t;
  const k = E(u, 0, NOTICE) * (1 - E(u, LOWER - .2, LOWER + .5));      // overall excitement
  const arm = E(u, NOTICE * .6, RAISE) * (1 - E(u, WAVE_END, LOWER));     // arm raised amount
  const osc = Math.sin((u - RAISE) * Math.PI * 2 * 1.9) * E(u, RAISE - .1, RAISE + .3) * (1 - E(u, WAVE_END - .3, WAVE_END));
  return { k, arm, osc, side: ev.side || 1, happy: k };
}

// ---- mist + sparkles (deterministic) ----
function rng(sd) { return () => { sd = sd + 0x6D2B79F5 | 0; let t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const sparks = Array.from({ length: 26 }, () => ({ x: R() * 2 - 1, ph: R(), sp: .05 + R() * .08, r: 1.5 + R() * 2.5, tw: R() * 6 }));
const wisps = Array.from({ length: 7 }, () => ({ x: R() * 2 - 1, ph: R() * 6.28, r: .25 + R() * .25 }));

function arm(sx, ang, s) {
  const sig = Math.sign(sx) || 1;
  // a soft sheet "sleeve": tapered lobe from shoulder, rounded end
  g.save(); g.translate(sx, -40 * s); g.rotate(-sig * ang);
  const L = 175 * s, w0 = 52 * s, w1 = 34 * s;
  g.beginPath();
  g.moveTo(-w0, 0);
  g.bezierCurveTo(-w0 * 1.05, L * .45, -w1 * 1.3, L * .8, 0, L + w1 * .2);
  g.bezierCurveTo(w1 * 1.3, L * .8, w0 * 1.05, L * .45, w0, 0);
  g.closePath(); g.fill();
  g.restore();
}

function ghost(t, cx, cy, s) {
  const ws = waveState(t), side = ws.side;
  // float + sway + lean toward the waver
  const bob = Math.sin(t * 1.25) * 22 * s - ws.k * 18 * s;
  const drift = Math.sin(t * .45) * 45 * s + ws.k * side * 35 * s;
  const tilt = Math.sin(t * .8) * .035 + ws.k * side * .09;
  const sway = Math.sin(t * 1.1 + .6) * 22 * s - ws.k * side * 18 * s;   // hem lags behind
  g.save(); g.translate(cx + drift, cy + bob); g.rotate(tilt);

  // shadow-glow pass
  const body = g.createRadialGradient(0, -170 * s, 20 * s, 0, 40 * s, 470 * s);
  body.addColorStop(0, 'rgba(255,255,255,0.98)'); body.addColorStop(.55, 'rgba(236,244,255,0.94)'); body.addColorStop(1, 'rgba(190,212,240,0.80)');
  g.fillStyle = body; g.shadowColor = 'rgba(160,205,255,0.9)'; g.shadowBlur = (55 + 25 * ws.k + 8 * Math.sin(t * 2)) * s;

  // arms (behind body). rest angle: hanging down-out. wave arm swings up.
  const restA = .55, upA = 2.55;
  const waveA = lerp(restA + Math.sin(t * 1.3) * .06, upA + ws.osc * .38, ws.arm);
  const otherA = restA + Math.sin(t * 1.3 + 1) * .06 + ws.k * .12;
  arm(side * 140 * s, waveA, s);         // waving arm on the waver's side
  arm(-side * 140 * s, otherA, s);

  // body: round head, flared sheet, scalloped hem that ripples
  const D = (x, y) => { const f = clamp((y + 160 * s) / (460 * s)); return [x + sway * f * f, y]; };
  const hemY = 300 * s, N = 6, HW = 215 * s;
  g.beginPath();
  g.moveTo(...D(-150 * s, -170 * s));
  g.arc(0, -170 * s, 150 * s, Math.PI, 0);
  g.bezierCurveTo(...D(150 * s, -40 * s), ...D(190 * s, 130 * s), ...D(HW, hemY));
  for (let i = 0; i < N; i++) {
    const x0 = HW - (2 * HW) * i / N, x1 = HW - (2 * HW) * (i + 1) / N, xm = (x0 + x1) / 2;
    const r1 = Math.sin(t * 2.6 + i * 1.3) * 14 * s, r2 = Math.sin(t * 2.6 + (i + 1) * 1.3) * 10 * s;
    g.quadraticCurveTo(...D(xm, hemY + 46 * s + r1), ...D(x1, hemY + (i + 1 < N ? r2 : 0)));
  }
  g.bezierCurveTo(...D(-190 * s, 130 * s), ...D(-150 * s, -40 * s), ...D(-150 * s, -170 * s));
  g.closePath(); g.fill();
  g.shadowBlur = 0;

  // face
  const look = Math.sin(t * .37) * 8 * s + ws.k * side * 14 * s;
  const blink = ((t + 1.7) % 4.6) < .13 && ws.k < .5 ? .12 : 1;
  const eyeS = 1 + ws.k * .18;
  g.fillStyle = '#0b0b12';
  for (const ex of [-52, 52]) {
    g.beginPath(); g.ellipse(ex * s + look, -185 * s, 23 * s * eyeS, 36 * s * eyeS * blink, 0, 0, 7); g.fill();
    if (blink > .5) { g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(ex * s + look + 8 * s, -197 * s, 7 * s, 0, 7); g.fill(); g.fillStyle = '#0b0b12'; }
  }
  // mouth: little "o" idle -> open smile when waving
  const my = -112 * s, mx = look * .8;
  if (ws.happy < .5) {
    const o = 1 - ws.happy * 2;
    g.beginPath(); g.ellipse(mx, my, 14 * s * o + 2, 19 * s * o + 2, 0, 0, 7); g.fill();
  }
  if (ws.happy > 0) {
    g.save(); g.globalAlpha = clamp(ws.happy * 2 - .3);
    g.beginPath(); g.moveTo(mx - 36 * s, my - 8 * s); g.quadraticCurveTo(mx, my + 44 * s, mx + 36 * s, my - 8 * s); g.quadraticCurveTo(mx, my + 8 * s, mx - 36 * s, my - 8 * s); g.fill();
    g.fillStyle = 'rgba(255,140,170,.35)';
    for (const ex of [-88, 88]) { g.beginPath(); g.ellipse(ex * s + look, -132 * s, 24 * s, 13 * s, 0, 0, 7); g.fill(); }
    g.restore();
  }
  g.restore();
  return ws;
}

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (MIRROR) { g.translate(W, 0); g.scale(-1, 1); }
  const s = Math.min(W / 1920, H / 1080) * 1.12, cx = W / 2, cy = H * .5;
  // faint mist under the ghost
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const m of wisps) {
    const x = cx + (m.x * 420 + Math.sin(t * .2 + m.ph) * 80) * s, y = cy + 390 * s + Math.sin(t * .3 + m.ph) * 15 * s, r = m.r * 420 * s;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(140,180,230,.07)'); gr.addColorStop(1, 'rgba(140,180,230,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * .35, 0, 0, 7); g.fill();
  }
  g.restore();
  const ws = ghost(t, cx, cy, s);
  // sparkles that drift up (burst a little when waving)
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    const u = (t * p.sp + p.ph) % 1, x = cx + p.x * 520 * s + Math.sin(t + p.tw) * 20 * s, y = cy + (380 - u * 900) * s;
    const a = Math.sin(u * Math.PI) * (.35 + .4 * ws.k) * (.6 + .4 * Math.sin(t * 3 + p.tw));
    g.fillStyle = `rgba(200,225,255,${a})`; g.beginPath(); g.arc(x, y, p.r * s * (1 + ws.k * .6), 0, 7); g.fill();
  }
  g.restore();
}
window.draw = draw;

if (!RENDER) {
  const t0 = performance.now(), now = () => (performance.now() - t0) / 1000;
  const hud = document.getElementById('hud'); let showHud = P.has('hud');
  let last = -99;
  function trigger(side) {
    const t = now(); if (t - last < LOWER + .3) return false;      // finish current wave first
    last = t; window.WAVES.push({ t, side: side || (Math.random() < .5 ? -1 : 1) }); if (window.WAVES.length > 20) window.WAVES.shift(); return true;
  }
  window.trigger = trigger;
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'w') trigger(); if (k === 'l') trigger(-1); if (k === 'r') trigger(1);
    if (k === 'm') MIRROR = !MIRROR; if (k === 'h') showHud = !showHud;
    if (k === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  });
  let conn = 'offline';
  if (location.protocol.startsWith('http')) {
    const es = new EventSource('/events');
    es.onopen = () => conn = 'connected';
    es.onerror = () => conn = 'reconnecting…';
    es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === 'wave') trigger(m.side); if (m.type === 'mirror') MIRROR = !!m.on; } catch {} };
  }
  (function loop() {
    draw(now());
    hud.textContent = showHud ? `feed: ${conn} · waves: ${window.WAVES.length} · W=wave L/R=side M=mirror F=fullscreen H=hide` : '';
    requestAnimationFrame(loop);
  })();
}
</script></body></html>
